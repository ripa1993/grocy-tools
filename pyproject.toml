[project]
name = "grocy-rest-api-client"
version = "4.2.0"
description = "A client library for accessing Grocy REST API"
readme = "README.md"
authors = []
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx>=0.20.0,<0.28.0",
    "attrs>=21.3.0",
    "python-dateutil<3",
    "openfoodfacts<3",
    "click<9",
]

[project.scripts]
grocy-tools = "grocy_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grocy_rest_api_client", "grocy_tools"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
